<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; }
  tycho-viewer { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<tycho-viewer scene="#tycho-scene" data="#tycho-data"{{ATTRS}}></tycho-viewer>
<script type="application/octet-stream" id="tycho-scene" data-encoding="base64">{{SCENE}}</script>
<script type="application/octet-stream" id="tycho-data" data-encoding="base64">{{DATA}}</script>
<script>{{RUNTIME}}</script>
</body>
</html>
