name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runs-on: [ubuntu-latest]
        include:
          - python-version: "3.10"
            runs-on: macos-latest
          - python-version: "3.14"
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest --durations=10

  lowest:
    name: Python 3.10 at the lowest direct dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
      - run: uv run --resolution lowest-direct pytest

  web:
    name: Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack, which checks the notices and builds the bundles and the types
        run: npm pack
      - run: npx --yes publint@0.3 --strict
      - run: npx --yes @arethetypeswrong/cli@0.18 ./beeson-group-tycho-*.tgz --profile esm-only --exclude-entrypoints ./iife
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime
          path: src/pytycho/_static/tycho.js
          if-no-files-found: error

  dist:
    name: Distributions
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: src/pytycho/_static
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 .github/check_versions.py
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel carries the runtime and the notices, and the sdist does not carry example data
        run: |
          unzip -l dist/*.whl | tee wheel.txt
          for f in pytycho/_static/tycho.js licenses/LICENSE licenses/NOTICE licenses/THIRD_PARTY_NOTICES.md; do
            grep -q "$f" wheel.txt || { echo "::error::the wheel has no $f"; exit 1; }
          done
          if tar -tzf dist/*.tar.gz | grep -E '^[^/]+/examples/.*\.(csv|tys|tyd|html)$'; then
            echo "::error::the sdist carries example data"; exit 1
          fi
      - name: The installed wheel writes a page that carries the runtime and its notices
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/python - <<'EOF'
          import numpy as np
          import pytycho as ty

          scene = ty.Scene(title="smoke")
          frame = scene.frame("f", axes=("x", "y", "z"))
          loop = scene.track_set("loop", frame=frame, periodic=True)
          t = np.linspace(0.0, 2.0 * np.pi, 50)
          loop.add(np.column_stack([np.cos(t), np.sin(t)]))
          scene.clock(channels=["@index"], steps=50)
          scene.view("main", frame=frame, driver=ty.driver(loop, 0), layers=[ty.track(loop)])
          scene.panel("p", "main")
          scene.write_html("smoke.html")
          page = open("smoke.html", encoding="utf-8").read()
          assert "This bundle contains" in page and "three 0." in page, "the page has no notice banner"
          EOF

  pass:
    name: All checks pass
    if: always()
    needs: [lint, tests, lowest, web, dist]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
