# The lint job of .github/workflows/ci.yml runs these hooks, and Dependabot updates each rev monthly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # the conformance corpus has cases of several hundred KB
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  # pyright is used because src passes its standard mode as written, while mypy would need code changes
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: "v1.1.414"
    hooks:
      - id: pyright
        files: ^(src|tests|examples)/
        additional_dependencies: ["numpy", "pytest", "jsonschema"]

  # prettier runs in check mode, since the TypeScript follows web/.prettierrc.json and is reformatted by hand
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.9"
    hooks:
      - id: prettier
        entry: prettier --check --ignore-unknown
        files: ^web/(src|test|scripts)/
        types_or: [ts, javascript]
        exclude: ^web/src/scene\.gen\.ts$  # web/scripts/gen-types.mjs writes it, and a test compares it verbatim

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli; python_version<'3.11'

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest|PyDylan|Pydylan|PyTycho
        exclude: ^\.pre-commit-config\.yaml$

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "v1.30.1"
    hooks:
      - id: zizmor
