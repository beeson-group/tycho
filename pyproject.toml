[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytycho"
dynamic = ["version"]
description = "Animated, interactive astrodynamics visualizations in a single HTML file"
readme = "README.md"
# the wheel carries the runtime bundle, which contains three.js and mp4-muxer (both MIT)
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "AUTHORS", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Claudio Vestini" }, { name = "Jannik Graebner" }, { name = "Nina Karampela" }, { name = "Jack Sydney Schwartz" }]
keywords = ["astrodynamics", "visualization", "three-body", "periodic orbits", "webgl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/beeson-group/tycho"
Documentation = "https://pytycho.readthedocs.io/"
"Bug Tracker" = "https://github.com/beeson-group/tycho/issues"
Discussions = "https://github.com/beeson-group/tycho/discussions"
Changelog = "https://github.com/beeson-group/tycho/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
  "pytest>=9",
  "jsonschema>=4.18",  # validates written scenes against spec/scene.schema.json
]
docs = [
  "sphinx>=9.1",
  "myst-parser>=5.1",
  "pydata-sphinx-theme>=0.22",
  "sphinx-autodoc-typehints>=3.13",
  "sphinx-design>=0.7",
  "sphinx-llms-txt>=0.7.1",
]
dev = [
  { include-group = "test" },
  "nox>=2025.5",  # for an editor to resolve the imports of noxfile.py. `uvx nox` does not need it
  "hatchling>=1.27",  # for an editor to resolve the imports of hatch_build.py. builds get it from build-system anyway
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }  # Sphinx 9.1 and sphinx-autodoc-typehints 3.13 need Python 3.12

[tool.hatch]
version.path = "src/pytycho/__init__.py"

[tool.hatch.build]
# the gitignored runtime bundle, built by `npm --prefix web run build`, is listed here for the sdist and the wheel to carry it
artifacts = ["src/pytycho/_static/tycho.js"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/**/*.csv", "examples/**/*.tys", "examples/**/*.tyd", "examples/**/*.html", "examples/**/*.png"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]
markers = ["pydylan: requires a built PyDyLAN"]

[tool.ruff]
line-length = 140  # the width of the code base. the default of 88 would rewrap most of it
show-fixes = true
src = ["src", "tests"]  # the helpers in tests/ are imported as first-party

[tool.ruff.lint]
# E and W, plus a subset of the rules that the Scientific Python Development Guide recommends. EM (flake8-errmsg) is left out, since
# the messages of pytycho put the rule number in an f-string by design
extend-select = [
  "E",    # pycodestyle errors, E501 at the line length above
  "W",    # pycodestyle warnings
  "B",    # flake8-bugbear
  "I",    # isort
  "ARG",  # flake8-unused-arguments
  "C4",   # flake8-comprehensions
  "EXE",  # flake8-executable
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "NPY",  # NumPy-specific rules
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "UP",   # pyupgrade
  "YTT",  # flake8-2020
]
ignore = [
  "PLC0415",  # import outside top level, which the lazy optional imports (e.g. jsonschema) need
  "PLR09",    # too many arguments, branches, or statements
  "PLR2004",  # magic value in a comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"examples/**" = ["T20"]
"spec/conformance/*.py" = ["T20"]
"noxfile.py" = ["T20"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.codespell]
ignore-words-list = ["afterall", "inout", "istall", "useg"]  # a hook of vitest, an OpenGL Shading Language keyword, isTall, and a shader uniform in web/src/runtime
skip = ["web/package-lock.json"]
