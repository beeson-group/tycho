[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytycho"
dynamic = ["version"]
description = "Animated, interactive astrodynamics visualizations in a single HTML file"
readme = "README.md"
# the wheel carries the runtime bundle, which contains three.js and mp4-muxer (both MIT)
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "AUTHORS", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Claudio Vestini" }, { name = "Nina Karampela" }, { name = "Jack Sydney Schwartz" }]
keywords = ["astrodynamics", "visualization", "three-body", "periodic orbits", "webgl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/beeson-group/tycho"
Documentation = "https://pytycho.readthedocs.io/"
"Bug Tracker" = "https://github.com/beeson-group/tycho/issues"
Discussions = "https://github.com/beeson-group/tycho/discussions"
Changelog = "https://github.com/beeson-group/tycho/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
  "pytest>=9",
  "jsonschema>=4.18",  # validates written scenes against spec/scene.schema.json
]
docs = [
  "sphinx>=9.1",
  "myst-parser>=5.1",
  "pydata-sphinx-theme>=0.22",
  "sphinx-autodoc-typehints>=3.13",
  "sphinx-design>=0.7",
  "sphinx-llms-txt>=0.7.1",
]
dev = [
  { include-group = "test" },
  "nox>=2025.5",  # for an editor to resolve the imports of noxfile.py. `uvx nox` does not need it
  "hatchling>=1.27",  # for an editor to resolve the imports of hatch_build.py. builds get it from build-system anyway
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }  # Sphinx 9.1 and sphinx-autodoc-typehints 3.13 need Python 3.12

[tool.hatch]
version.path = "src/pytycho/__init__.py"

[tool.hatch.build]
# the gitignored runtime bundle, built by `npm --prefix web run build`, is listed here for the sdist and the wheel to carry it
artifacts = ["src/pytycho/_static/tycho.js"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/**/*.csv", "examples/**/*.tys", "examples/**/*.tyd", "examples/**/*.html", "examples/**/*.png"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
