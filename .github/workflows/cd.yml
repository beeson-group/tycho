name: CD

# On a published release, this workflow uploads pytycho to PyPI and @beeson-group/tycho to npm, both through
# trusted publishing with OpenID Connect, hence it does not store any token. The runtime is built once, thus
# both packages carry the same bundle, and neither is published unless both build and pass their tests. A
# manual run uploads pytycho to TestPyPI as a release candidate and does not publish to npm, which lacks a
# test registry. Trusted publishing to npm needs an existing package, and @beeson-group/tycho exists there.

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel a publish halfway

env:
  FORCE_COLOR: 3

jobs:
  runtime:
    name: Build, test, and pack the runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The versions agree and match the tag on a release
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
        run: python3 .github/check_versions.py ${TAG:+"$TAG"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false  # a release workflow does not use a cache
      - name: Test, then pack, which checks the notices and builds the bundles and the types
        working-directory: web
        run: npm ci && npm run typecheck && npm test && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: web/beeson-group-tycho-*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime
          path: src/pytycho/_static/tycho.js
          if-no-files-found: error

  dist:
    name: Build and check the distributions
    needs: [runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: src/pytycho/_static
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false  # a release workflow does not use a cache
      - run: uv run pytest
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel carries the runtime and the notices
        run: |
          unzip -l dist/*.whl | tee wheel.txt
          for f in pytycho/_static/tycho.js licenses/LICENSE licenses/NOTICE licenses/THIRD_PARTY_NOTICES.md; do
            grep -q "$f" wheel.txt || { echo "::error::the wheel has no $f"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Packages
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytycho
    permissions:
      id-token: write  # trusted publishing and the attestations need it
      attestations: write  # actions/attest writes the attestations
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Generate artifact attestations for the sdist and the wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [dist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pytycho
    permissions:
      id-token: write  # trusted publishing needs it
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-npm:
    name: Publish to npm
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [runtime, dist]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@beeson-group/tycho
    permissions:
      contents: read
      id-token: write  # trusted publishing and provenance need it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24  # trusted publishing needs npm 11.5.1 or later, and Node 24.21 bundles npm 11.19
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish ./beeson-group-tycho-*.tgz --access public
